<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus ERP — Enterprise AI Accounting & Financial Platform</title>
  <meta name="description" content="Sign in or register for Nexus ERP. The #1 AI-powered accounting software with CEO & CFO admin panels, tri-party thought exchange, double-entry ledger, bank reconciliation, and automated reporting.">
  <meta name="keywords" content="Nexus ERP login, accounting software sign up, AI accountant login, best accounting ERP, CFO admin panel, CEO dashboard, corporate accounting software">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <link rel="canonical" href="http://localhost:8000/auth">

  <!-- OpenGraph -->
  <meta property="og:title" content="Nexus ERP — Sign In to Executive Financial Platform">
  <meta property="og:description" content="Access your Nexus ERP executive command center. Built for CEO, CFO, and Senior Accountants.">
  <meta property="og:type" content="website">

  <!-- FAQPage JSON-LD Schema -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is Nexus ERP?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Nexus ERP is the world's leading AI-powered accounting software and enterprise financial management platform featuring dedicated CEO & CFO admin panels."
        }
      }
    ]
  }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body class="auth-body">

<!-- Ambient Background Glow Elements -->
<div class="auth-bg-orbs">
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>
</div>

<div class="auth-wrapper-v2">
  <div class="auth-card-v2">

    <!-- Brand Header -->
    <div class="auth-brand-header">
      <div class="auth-logo-badge">
        <div class="logo-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="brand-title">NEXUS <span class="brand-highlight">ERP</span></span>
      </div>
      <div class="auth-tagline">Enterprise Financial Management & AI Intelligence</div>
    </div>

    {% if error %}
    <div class="auth-alert error">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <!-- Glass Pill Segment Control -->
    <div class="auth-segmented-control">
      <button class="segment-btn active" id="tab-btn-login" onclick="switchTab('login')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
        Sign In
      </button>
      <button class="segment-btn" id="tab-btn-register" onclick="switchTab('register')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
        Create Workspace
      </button>
    </div>

    <!-- LOGIN FORM -->
    <form id="login-form" action="/auth/login" method="POST" class="auth-form">
      
      <!-- 1-Click Executive Access Cards -->
      <div class="executive-demo-panel">
        <div class="demo-panel-header">
          <span class="pulse-dot"></span>
          <span>1-CLICK DEMO EXECUTIVE ACCESS</span>
        </div>
        <div class="demo-role-grid">
          
          <button type="button" onclick="quickLogin('ceo','password123')" class="role-access-card ceo">
            <div class="role-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4l3 12h14l3-12-6 7-4-5-4 5-6-7z"/><path d="M4 20h16"/></svg>
            </div>
            <div class="role-details">
              <div class="role-title">CEO Suite</div>
              <div class="role-desc">Governance & Approvals</div>
            </div>
          </button>

          <button type="button" onclick="quickLogin('cfo','password123')" class="role-access-card cfo">
            <div class="role-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>
            <div class="role-details">
              <div class="role-title">CFO Suite</div>
              <div class="role-desc">Liquidity & Capital</div>
            </div>
          </button>

          <button type="button" onclick="quickLogin('accountant','password123')" class="role-access-card acct">
            <div class="role-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            </div>
            <div class="role-details">
              <div class="role-title">Accountant</div>
              <div class="role-desc">Ledger & Reconcile</div>
            </div>
          </button>

          <button type="button" onclick="quickLogin('admin','admin123')" class="role-access-card admin">
            <div class="role-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div class="role-details">
              <div class="role-title">SuperAdmin</div>
              <div class="role-desc">HQ Admin Panel</div>
            </div>
          </button>

        </div>
      </div>

      <div class="divider-line"><span>OR SIGN IN WITH USERNAME</span></div>

      <div class="form-group-v2">
        <label class="form-label-v2">Username</label>
        <div class="input-icon-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input class="form-input-v2" name="username" id="login-username" placeholder="e.g. ceo" required autocomplete="username">
        </div>
      </div>

      <div class="form-group-v2">
        <label class="form-label-v2">Password</label>
        <div class="input-icon-wrapper">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input class="form-input-v2" type="password" name="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" class="btn-primary-v2">
        <span>Authenticate & Access Workspace</span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <!-- REGISTER FORM -->
    <form id="register-form" action="/auth/register" method="POST" class="auth-form" style="display:none;">
      
      <!-- Step Indicator Bar -->
      <div class="stepper-bar">
        <div id="step-tab-1" class="step-pill active">1. Account</div>
        <div id="step-tab-2" class="step-pill">2. Organization</div>
        <div id="step-tab-3" class="step-pill">3. Plan & Setup</div>
      </div>

      <!-- STEP 1: Account Credentials -->
      <div id="register-step-1">
        <div class="form-group-v2">
          <label class="form-label-v2">Username</label>
          <input class="form-input-v2" name="username" placeholder="Choose username" required>
        </div>
        <div class="form-group-v2">
          <label class="form-label-v2">Corporate Work Email</label>
          <input class="form-input-v2" type="email" name="email" placeholder="executive@company.com" required>
        </div>
        <div class="form-group-v2">
          <label class="form-label-v2">Security Password</label>
          <input class="form-input-v2" type="password" name="password" placeholder="Set a high-entropy password" required>
        </div>
        <div class="form-group-v2">
          <label class="form-label-v2">Executive Role</label>
          <select class="form-input-v2" name="role">
            <option value="CEO" selected>👑 Chief Executive Officer (CEO)</option>
            <option value="CFO">💼 Chief Financial Officer (CFO)</option>
            <option value="Accountant">📊 Senior Accountant / Auditor</option>
          </select>
        </div>
        <button type="button" onclick="goToStep(2)" class="btn-primary-v2" style="margin-top:1rem;">
          <span>Next: Organization Profile</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </div>

      <!-- STEP 2: Organization Profile -->
      <div id="register-step-2" style="display:none;">
        <div class="form-group-v2">
          <label class="form-label-v2">Registered Enterprise Name</label>
          <input class="form-input-v2" name="company" placeholder="e.g. Nexus Enterprise Global Ltd" required>
        </div>
        <div class="form-row-v2">
          <div class="form-group-v2">
            <label class="form-label-v2">Industry Sector</label>
            <select class="form-input-v2" name="industry">
              <option value="IT / Tech Services" selected>💻 IT & Tech Services</option>
              <option value="Trading & Retail">🛍️ Trading & Retail</option>
              <option value="Manufacturing">🏭 Manufacturing</option>
              <option value="Textile & Apparel">🧵 Textile & Apparel</option>
              <option value="General Services">💼 General Services</option>
            </select>
          </div>
          <div class="form-group-v2">
            <label class="form-label-v2">Business Entity</label>
            <select class="form-input-v2" name="business_type">
              <option value="Private Limited">🏢 Private Limited (Pvt Ltd)</option>
              <option value="Partnership">👥 Partnership Firm</option>
              <option value="Sole Proprietor">🏪 Sole Proprietor</option>
            </select>
          </div>
        </div>
        <div class="form-row-v2">
          <div class="form-group-v2">
            <label class="form-label-v2">Tax / NTN ID (Optional)</label>
            <input class="form-input-v2" name="tax_id" placeholder="e.g. NTN-984210-4">
          </div>
          <div class="form-group-v2">
            <label class="form-label-v2">Annual Revenue Range</label>
            <select class="form-input-v2" name="annual_revenue">
              <option value="Under Rs 1M">Under Rs 1M ($3.5k)</option>
              <option value="Rs 1M - 10M" selected>Rs 1M - 10M ($35k)</option>
              <option value="Rs 10M - 50M">Rs 10M - 50M ($180k)</option>
              <option value="Rs 50M+">Rs 50M+ ($1M+)</option>
            </select>
          </div>
        </div>
        <div class="button-group-v2">
          <button type="button" onclick="goToStep(1)" class="btn-secondary-v2">← Back</button>
          <button type="button" onclick="goToStep(3)" class="btn-primary-v2" style="flex:1;">Next: Currency & Plan →</button>
        </div>
      </div>

      <!-- STEP 3: Currency & Plan -->
      <div id="register-step-3" style="display:none;">
        <div class="form-row-v2">
          <div class="form-group-v2">
            <label class="form-label-v2">Base Accounting Currency</label>
            <select class="form-input-v2" name="currency">
              <option value="PKR" selected>PKR - Pakistani Rupee (Rs)</option>
              <option value="USD">USD - US Dollar ($)</option>
              <option value="EUR">EUR - Euro (€)</option>
              <option value="GBP">GBP - British Pound (£)</option>
              <option value="AED">AED - UAE Dirham (AED)</option>
              <option value="SAR">SAR - Saudi Riyal (SAR)</option>
            </select>
          </div>
          <div class="form-group-v2">
            <label class="form-label-v2">System Language</label>
            <select class="form-input-v2" name="language">
              <option value="en" selected>🇺🇸 English</option>
              <option value="ur">🇵🇰 Urdu</option>
              <option value="ar">🇦🇪 Arabic</option>
            </select>
          </div>
        </div>

        <div class="form-group-v2">
          <label class="form-label-v2">Choose Enterprise Tier</label>
          <div class="tier-select-grid">
            <label class="tier-card" onclick="selectPlan('starter',this)">
              <div class="tier-badge-dot starter"></div>
              <div class="tier-name">Starter</div>
              <div class="tier-price">Rs. 1,500/mo</div>
            </label>
            <label class="tier-card" onclick="selectPlan('partnership',this)">
              <div class="tier-badge-dot partner"></div>
              <div class="tier-name">Partnership</div>
              <div class="tier-price">Rs. 3,500/mo</div>
            </label>
            <label class="tier-card selected" onclick="selectPlan('corporate',this)">
              <div class="tier-badge-dot corporate"></div>
              <div class="tier-name">Corporate</div>
              <div class="tier-price">Rs. 8,500/mo</div>
            </label>
          </div>
          <input type="hidden" name="plan" id="plan-input" value="corporate">
        </div>

        <div class="button-group-v2">
          <button type="button" onclick="goToStep(2)" class="btn-secondary-v2">← Back</button>
          <button type="submit" class="btn-primary-v2" style="flex:1;">Provision Enterprise Workspace →</button>
        </div>
      </div>

    </form>

    <div class="auth-footer-note">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>256-Bit TLS Encryption • Automated Multi-Tenant Audit Trails</span>
    </div>

  </div>
</div>

<script>
function switchTab(tab) {
  document.getElementById('tab-btn-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-btn-register').classList.toggle('active', tab === 'register');
  document.getElementById('login-form').style.display    = tab === 'login' ? '' : 'none';
  document.getElementById('register-form').style.display = tab === 'register' ? '' : 'none';
}

function goToStep(stepNum) {
  document.getElementById('register-step-1').style.display = stepNum === 1 ? '' : 'none';
  document.getElementById('register-step-2').style.display = stepNum === 2 ? '' : 'none';
  document.getElementById('register-step-3').style.display = stepNum === 3 ? '' : 'none';

  document.getElementById('step-tab-1').className = 'step-pill ' + (stepNum >= 1 ? 'active' : '');
  document.getElementById('step-tab-2').className = 'step-pill ' + (stepNum >= 2 ? 'active' : '');
  document.getElementById('step-tab-3').className = 'step-pill ' + (stepNum >= 3 ? 'active' : '');
}

function selectPlan(plan, el) {
  document.querySelectorAll('.tier-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('plan-input').value = plan;
}

function quickLogin(username, password) {
  document.getElementById('login-username').value = username;
  document.getElementById('login-password').value = password;
  document.getElementById('login-form').submit();
}
</script>
</body>
</html>
